name: Collect air quality data

on:
  schedule:
    # Runs a few minutes past the hour (avoids the :00 slot, which is
    # oversubscribed on GitHub's scheduler and can be delayed).
    - cron: "5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        run: python run.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.csv
          if git diff --cached --quiet; then
            echo "No new data this run."
          else
            git commit -m "Automated data collection $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi
